name: Showroom 2027 validation

on:
  pull_request:
    branches: [main]
    paths:
      - "app/fordon/**"
      - "components/VehicleDetail2027.tsx"
      - "components/StockExplorer.tsx"
      - "public/showroom-2027/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/showroom-2027.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Type-check
        run: npx tsc --noEmit
      - name: Next.js build
        run: npm run build
